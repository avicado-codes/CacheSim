# CI: the gates from AGENTS.md section 3.
#   dataset: the standard benchmark trace is byte-identical to its manifest.
#   native:  GCC and Clang Release with -Werror, plus GCC Debug under ASan + UBSan.
#   wasm:    the Emscripten browser module, loaded and checked end to end in Node.
#   web:     the website (typecheck, Vitest, Vite build) around the module from the wasm job.
#   bench:   throughput report (nightly and on demand only; timings are noisy on shared runners).
# Runs on every push and pull request, and nightly on main so project health is reported even
# when nobody pushes (toolchain or runner-image drift shows up the morning after, not weeks later).
name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "docs/**"]
  pull_request:
  schedule:
    - cron: "30 2 * * *"  # 02:30 UTC daily, default branch
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Full suites (including the long ASan stress run) on nightly and manual runs; push/PR runs
  # skip only the stress label under ASan, which takes 15+ minutes there.
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  dataset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Standard dataset integrity
        # Pinned in tests/data/standard/README.md; never modify the file (AGENTS.md section 5).
        run: |
          echo "9619648721957a502f486f5290bd924a5e52592f59dad1b34e1d445a4dd3086e  tests/data/standard/matmul64-O0.trace.gz" | sha256sum -c -

  native:
    name: ${{ matrix.name }}
    needs: dataset
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            type: Release
            flags: ""
            asan: false
          - name: clang-release
            cc: clang
            cxx: clang++
            type: Release
            flags: ""
            asan: false
          - name: gcc-asan-ubsan
            cc: gcc
            cxx: g++
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
            asan: true
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCCSIM_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Test
        # A suite exits 77 (skipped) when zlib or src/policy/ is missing; both exist, so a skip is a failure.
        run: |
          set -o pipefail
          args=""
          if [ "${{ matrix.asan }}" = "true" ] && [ "$FULL" != "true" ]; then args="-LE stress"; fi
          ctest --test-dir build --output-on-failure --no-tests=error $args | tee ctest.log
          if grep -q 'Skipped' ctest.log; then echo "::error::a suite was skipped"; exit 1; fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E 'Test +#|tests passed|tests failed' ctest.log || echo "tests did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wasm:
    needs: dataset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCCSIM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-wasm --target ccsim_wasm
      - name: Size
        run: |
          ls -l build-wasm/src/wasm/ccsim.mjs build-wasm/src/wasm/ccsim.wasm
          echo "wasm: $(stat -c %s build-wasm/src/wasm/ccsim.wasm) bytes, $(gzip -9c build-wasm/src/wasm/ccsim.wasm | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test in Node
        # Production policies are merged, so every check must run: exit 77 (skipped) is a failure.
        run: node tests/wasm/smoke.mjs build-wasm/src/wasm/ccsim.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ccsim-wasm
          path: |
            build-wasm/src/wasm/ccsim.mjs
            build-wasm/src/wasm/ccsim.wasm
          retention-days: 14

  web:
    # ARCHITECTURE section 15: the site is built around the engine module from the wasm job.
    # Playwright end to end (the two-level walkthrough in a real browser) is Planned.
    needs: wasm
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ccsim-wasm
          path: build-wasm/src/wasm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Decoder, config encoding, visualiser highlights and views, checked against the engine
        # fixtures in web/test/fixtures (kept current by ctest unit.web_fixtures_current).
        run: npm test
      - name: Build
        run: |
          npm run wasm:copy
          npm run build
          test -s dist/engine/ccsim.wasm && test -s dist/engine/ccsim.mjs && test -s dist/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: ccsim-site
          path: web/dist
          retention-days: 14

  bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCCSIM_BUILD_BENCHMARKS=ON
          cmake --build build
      - name: Benchmark
        run: |
          ctest --test-dir build -L bench --output-on-failure
          cat tests/results/benchmark_report.md >> "$GITHUB_STEP_SUMMARY"
